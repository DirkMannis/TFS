<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TransformersSale.com - Vintage G1 & More</title>
  <meta name="description" content="Original 1980s G1 Transformers, Beast Wars, Armada — all for sale!" />

  <style>
    :root {
      --g1-red:    #e31e24;   /* Autobot red */
      --g1-purple: #782988;   /* Decepticon purple */
      --g1-blue:   #00a2e8;   /* G1 toy-box blue */
      --g1-silver: #c0c0c0;
      --g1-black:  #111;
      --g1-gray:   #2a2a2a;
    }
    body { 
      font-family: 'Arial Black', Arial, sans-serif; 
      margin:0; 
      background:#000; 
      color:#eee; 
      background-image: repeating-linear-gradient(45deg, #111 0, #111 10px, #1a1a1a 10px, #1a1a1a 20px);
    }
    header {
      background: linear-gradient(to bottom, var(--g1-red), #b00000);
      padding:2rem;
      text-align:center;
      border-bottom:8px solid var(--g1-purple);
    }
    header h1 {
      margin:0;
      font-size:3.5rem;
      color:#fff;
      text-shadow: 4px 4px 0 #000, -2px -2px 0 var(--g1-blue);
      letter-spacing:2px;
    }
    .cat-nav {
      background:var(--g1-black);
      padding:1rem;
      text-align:center;
      position:sticky; top:0; z-index:100;
      border-bottom:4px solid var(--g1-silver);
    }
    .cat-nav a {
      color:var(--g1-blue);
      margin:0 1rem;
      font-weight:bold;
      text-decoration:none;
      font-size:1.1rem;
    }
    .cat-nav a:hover { color:#fff; text-shadow:0 0 10px var(--g1-blue); }

    .search-bar {
      text-align:center;
      padding:1rem;
      background:var(--g1-gray);
    }
    #search-input {
      width:90%; max-width:600px; padding:0.8rem; font-size:1.1rem;
      border:3px solid var(--g1-silver); border-radius:8px;
    }

    main { max-width:1400px; margin:2rem auto; padding:0 1rem; }
    section h2 {
      color:var(--g1-red);
      font-size:2.2rem;
      text-align:center;
      background:var(--g1-purple);
      padding:0.8rem;
      margin:3rem 0 1.5rem;
      border:4px solid var(--g1-silver);
      text-shadow:2px 2px 0 #000;
    }

    .item-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:2rem;
      padding:1rem 0;
    }
    @media (max-width:992px){ .item-grid{grid-template-columns:repeat(2,1fr);} }
    @media (max-width:600px){ .item-grid{grid-template-columns:1fr;} }

    .item {
      background:#222;
      border:4px solid var(--g1-silver);
      border-radius:8px;
      overflow:hidden;
      box-shadow:0 0 20px rgba(0,162,232,0.4);
      transition:0.3s;
    }
    .item:hover { transform:scale(1.03); box-shadow:0 0 30px var(--g1-blue); }

    .main-img { width:100%; height:320px; object-fit:cover; cursor:pointer; }
    .thumbnails { display:flex; gap:6px; padding:8px; background:#000; justify-content:center; }
    .thumb { width:70px; height:70px; object-fit:cover; cursor:pointer; border:3px solid var(--g1-silver); }

    .item-title { color:var(--g1-blue); margin:1rem; font-size:1.4rem; text-align:center; }
    .item-brief { margin:0 1rem 0.5rem; text-align:center; color:#ccc; }
    .item-price { font-size:1.8rem; font-weight:bold; text-align:center; color:#0f0; margin:0.5rem 0; }

    .btn-buy, .btn-offer {
      margin:0.8rem auto; display:block; width:90%;
      padding:0.9rem; font-size:1.1rem; border:none; border-radius:6px; cursor:pointer;
    }
    .btn-buy { background:var(--g1-red); color:#fff; font-weight:bold; }
    .btn-offer { background:var(--g1-purple); color:#fff; }

    .quantity { text-align:center; color:#ff0; margin-bottom:0.5rem; }

    details { margin:1rem; }
    summary { color:var(--g1-blue); cursor:pointer; font-weight:bold; }

    footer {
      background:#000;
      color:#888;
      text-align:center;
      padding:2rem;
      border-top:8px solid var(--g1-red);
    }
  </style>
</head>
<body>

<header>
  <h1>TransformersSale.com</h1>
</header>

<nav class="cat-nav">
  <a href="#g1">G1</a> |
  <a href="#g2">G2</a> |
  <a href="#collectibles">Collectibles</a> |
  <a href="#beastwars">Beast Wars</a> |
  <a href="#beastmachines">Beast Machines</a> |
  <a href="#rid">Robots in Disguise</a> |
  <a href="#armada">Armada</a> |
  <a href="#animated">Animated</a>
</nav>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="Search: Optimus Prime, Megatron, Soundwave…">
</div>

<main>
  <!-- Paste your sections exactly like before -->
  <section id="g1"><h2>G1 Transformers</h2><div class="item-grid"></div></section>
  <section id="g2"><h2>G2 Transformers</h2><div class="item-grid"></div></section>
  <!-- etc. -->
</main>

<footer>
  © 2025 TransformersSale.com • Vintage G1 & Beyond • Ships from Nebraska, USA
</footer>

<script>
// 1. Lightbox (unchanged)
document.querySelectorAll('.clickable').forEach(img => {
  img.onclick = () => {
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.97);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:pointer;';
    const big = document.createElement('img');
    big.src = img.src; big.style.maxWidth = '92%'; big.style.maxHeight = '92%';
    box.appendChild(big);
    box.onclick = () => box.remove();
    document.body.appendChild(box);
  };
});

// 2. URL + Text Search (combined & improved)
const urlParams = new URLSearchParams(window.location.search);
const urlSearch = urlParams.get('a') ? urlParams.get('a').toLowerCase() : '';

const searchInput = document.getElementById('search-input');

function filterItems(query) {
  document.querySelectorAll('.item').forEach(item => {
    const name = item.dataset.name.toLowerCase();
    item.style.display = name.includes(query) ? 'block' : 'none';
  });
}

// Run on page load (for ?a=Bluestreak links)
if (urlSearch) {
  searchInput.value = urlParams.get('a');
  filterItems(urlSearch);
}

// Live typing search
searchInput.addEventListener('input', () => {
  filterItems(searchInput.value.toLowerCase());
});

// 3. Make Offer + Sold Out (unchanged)
document.querySelectorAll('.btn-offer').forEach(btn => {
  btn.onclick = () => {
    const min = btn.dataset.min;
    const item = btn.dataset.item;
    const offer = prompt(`Make an offer for ${item} (minimum $${min}):`);
    if (offer && parseFloat(offer) >= parseFloat(min)) {
      location.href = `mailto:your.email@gmail.com?subject=Offer: ${encodeURIComponent(item)}&body=Item: ${item}%0AOffer: $${offer}%0AName:%0APhone:`;
    } else if (offer) alert(`Offer must be at least $${min}`);
  };
});

document.querySelectorAll('.qty-left').forEach(q => {
  if (parseInt(q.textContent) === 0) {
    const b = q.closest('.item').querySelector('.btn-buy');
    b.disabled = true; b.textContent = 'SOLD OUT'; b.style.background = '#555';
  }
});
</script>

</body>
</html>
